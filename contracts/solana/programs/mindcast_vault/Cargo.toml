[package]
name = "mindcast_vault"
version = "0.1.0"
description = "MindCast Autonomous AI Agent Prediction & Dispute-Free Settlement Vault on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mindcast_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
pyth-sdk-solana = "0.10.1"
solana-program = "~1.17"
